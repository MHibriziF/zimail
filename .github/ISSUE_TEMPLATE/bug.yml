name: Bug
description: Something isn't working.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Classic
        - Zero
        - Both
        - Not UI-related
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where
      options:
        - Production
        - wrangler dev
        - vite dev
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140, Windows 11
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, logs, the cause if you know it.
