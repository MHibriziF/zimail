name: Sync from upstream
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: github.repository != 'MHibriziF/zimail' && github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: curl -fsSL https://raw.githubusercontent.com/MHibriziF/zimail/main/scripts/sync-upstream.sh | bash
        env:
          SYNC_PUBLISH: '1'
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
