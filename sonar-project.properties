sonar.projectKey=zimail
sonar.projectName=Zimail
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,cli
sonar.tests=src
sonar.test.inclusions=**/__tests__/**

sonar.exclusions=**/node_modules/**,**/.svelte-kit/**,**/build/**,**/.wrangler/**,messages/**,migrations/**,src/lib/server/migrations/migrations.generated.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Makes the scan step itself fail (blocking CI) when the Quality Gate is red,
# instead of only reporting to the dashboard.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# The scanner CLI the scan action installs brings its own JRE. Asking our server
# for another costs a request and a large download through the flaky proxy.
sonar.scanner.skipJreProvisioning=true
